name: presentations CI

on:
  push:
    paths:
      - 'presentations/**'
      - '.github/workflows/presentations-ci.yml'
  pull_request:
    paths:
      - 'presentations/**'
      - '.github/workflows/presentations-ci.yml'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: presentations/package-lock.json

      - name: Install dependencies
        working-directory: presentations
        run: npm ci

      - name: Build PDF
        working-directory: presentations
        run: npm run build

      - name: Verify PDF was generated
        working-directory: presentations
        run: test -s dist/repository-overview.pdf
