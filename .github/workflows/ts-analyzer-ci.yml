name: ts-analyzer CI

on:
  push:
    paths:
      - 'packages/ts-analyzer/**'
  pull_request:
    paths:
      - 'packages/ts-analyzer/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        working-directory: packages/ts-analyzer
        run: npm ci

      - name: Build package
        working-directory: packages/ts-analyzer
        run: npm run build

      - name: Run tests
        working-directory: packages/ts-analyzer
        run: npm run test
